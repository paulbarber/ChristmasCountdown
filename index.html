<!doctype html>
<!-- Christmas Countdown, browser version. Copyright PR Barber. GPL-3.0 (see LICENSE). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Countdown</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #hint {
    position: fixed; top: 10px; left: 0; right: 0; text-align: center;
    font: 14px sans-serif; color: #888; transition: opacity 1s;
  }
  body.idle #hint { opacity: 0; }
  @media (display-mode: fullscreen), (display-mode: standalone) { #hint { display: none; } }
  #controls {
    position: fixed; left: 0; right: 0;
    bottom: max(1.5vh, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: min(3vw, 24px);
  }
  #controls button, #controls a {
    font: bold clamp(13px, min(2.6vh, 3.8vw), 26px) sans-serif; white-space: nowrap; color: #fff;
    padding: 0.5em 1em; border-radius: 999px; border: 2px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08); cursor: pointer; text-decoration: none;
    -webkit-tap-highlight-color: transparent; transition: transform 0.1s, background 0.2s;
  }
  #controls button:hover, #controls a:hover { background: rgba(255,255,255,0.2); }
  #controls button:active, #controls a:active { transform: scale(0.94); }
  #flurry { border-color: #9fe8ff; }
  #fireworks { border-color: #ffcc33; }
  #donate { border-color: #ff6b8a; }
  #controls button:disabled { opacity: 0.5; }
  #toast {
    position: fixed; left: 50%; bottom: calc(max(1.5vh, env(safe-area-inset-bottom)) + 4.5em);
    transform: translateX(-50%); font: 15px sans-serif; color: #fff;
    background: rgba(40,120,60,0.85); padding: 0.4em 1em; border-radius: 999px;
    opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  /* index.html?projector : the copy shown in the window listens for presses and hides the buttons */
  body.projector #controls, body.projector #hint, body.projector #toast { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click or tap for full screen</div>
<div id="controls">
  <button id="flurry" type="button">❄ Flurry</button>
  <button id="fireworks" type="button">✨ Fireworks</button>
  <a id="donate" href="https://www.justgiving.com/page/christmas-countdown?utm_source=CL&amp;utm_medium=DT"
     target="_blank" rel="noopener">♥ Donate</a>
</div>
<div id="toast"></div>
<script>
"use strict";

// --- Countdown logic (same schedule as the Python version) ---
// until 25 Dec: to Christmas | 25 Dec: Christmas Day | 26-31 Dec: to New Year
// 1 Jan: Happy New Year | from 2 Jan: to next Christmas
function countdownState(now) {
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  if (m === 12 && d === 25) return ["Christmas", "It's Christmas Day!", ""];
  if (m === 1 && d === 1) return ["New Year", "Happy New Year!", ""];
  let title, target;
  if (m === 12 && d > 25) { title = "New Year"; target = new Date(y + 1, 0, 1); }
  else { title = "Christmas"; target = new Date(y, 11, 25); }

  // Count in calendar days/hours so clock changes (BST/GMT) don't skew it
  let s = Math.floor((target - now) / 1000);
  const tz = (target.getTimezoneOffset() - now.getTimezoneOffset()) * 60;
  s -= tz;
  const days = Math.floor(s / 86400); s -= days * 86400;
  const hours = Math.floor(s / 3600); s -= hours * 3600;
  const mins = Math.floor(s / 60), secs = s - mins * 60;
  const u = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  return [title, u(days, "day") + " " + u(hours, "hour"), u(mins, "min") + " " + u(secs, "second")];
}

// --- Remote buttons: which relay channel this copy uses (must match ChristmasCountdown.py) ---
// The channel name mixes the "channel" in config.json with the GitHub owner/repo this copy runs
// from, so a fork (or a copy hosted somewhere else) automatically gets its own separate channel.
function normRepo(r) {
  return String(r || "").trim().toLowerCase().replace(/\.git$/, "").replace(/^\/+|\/+$/g, "");
}
function siteRepo(loc) {                       // paulbarber.github.io/ChristmasCountdown -> paulbarber/christmascountdown
  const host = loc.hostname.toLowerCase();
  const seg = loc.pathname.split("/").filter(Boolean)[0] || "";
  const m = host.match(/^([a-z0-9-]+)\.github\.io$/);
  if (m) return normRepo(m[1] + "/" + (seg && !seg.includes(".") ? seg : host));
  return normRepo(host + "/" + (seg.includes(".") ? "" : seg));
}
async function topicFor(channel, repo) {
  const data = new TextEncoder().encode(channel + "|" + repo);
  const hash = await crypto.subtle.digest("SHA-256", data);
  const hex = Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, "0")).join("");
  return "xmascd-" + hex.slice(0, 24);
}

if (typeof document !== "undefined") {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const colours = ["white", "orange", "white", "yellow", "white",
                   "cyan", "white", "blue", "white", "violet"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let w, h, flakes = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const speed = h / 300, wind = w / 10000;
    flakes = Array.from({ length: 30 }, () => {
      const s = speed + speed * Math.random() * 3;
      return { x: Math.random() * w, y: Math.random() * h,
               dx: wind + wind * Math.random(), dy: s,
               size: (h / 16) * s / speed / 4, colour: pick(colours) };
    });
  }

  // Draw text at size, shrinking it if it would overflow the width
  function text(str, y, size, colour) {
    ctx.font = size + "px Times, 'Times New Roman', serif";
    const tw = ctx.measureText(str).width;
    if (tw > w * 0.94) ctx.font = (size * w * 0.94 / tw) + "px Times, 'Times New Roman', serif";
    ctx.fillStyle = colour;
    ctx.fillText(str, w / 2, y);
  }

  let last = performance.now();
  function frame(t) {
    // Move snow at the Python version's pace (one step per 50 ms)
    const k = Math.min((t - last) / 50, 4); last = t;
    for (const f of flakes) {
      f.x += f.dx * k; f.y += f.dy * k;
      if (f.temp) { if (f.y > h + 10 || f.x > w + 10) f.dead = true; continue; }
      if (f.y > h + 10) {
        f.x = Math.random() * w; f.y = -10; f.colour = pick(colours);
        if (Math.random() > 0.99) { f.dy = -Math.abs(f.dy); f.y = h; }   // a few go back up
      } else if (f.y < -10) f.dy = Math.abs(f.dy);
      if (f.x > w + 10) f.x = -10;
    }
    if (flakes.some(f => f.dead)) flakes = flakes.filter(f => !f.dead);
    updateFireworks(t, k);

    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    const [title, l1, l2] = countdownState(new Date());
    text(title, 0.22 * h, h / 6, "red");
    text("Countdown!", 0.42 * h, h / 6, "red");
    text(l1, 0.68 * h, h / 8, "green");
    text(l2, 0.82 * h, h / 8, "green");

    for (const f of flakes) {
      ctx.font = f.size + "px Times, serif";
      ctx.fillStyle = f.colour;
      ctx.fillText("*", f.x, f.y);
    }
    drawFireworks();
    requestAnimationFrame(frame);
  }

  // --- Flurry: a burst of extra, faster snow that falls away ---
  function flurry() {
    if (flakes.length > 800) return;           // don't let repeated taps pile up
    const speed = h / 300, wind = w / 10000;
    for (let i = 0; i < 200; i++) {
      const s = speed * (3 + Math.random() * 4);
      flakes.push({ x: Math.random() * w * 1.1 - w * 0.1, y: -10 - Math.random() * h * 0.5,
                    dx: wind * (4 + Math.random() * 8), dy: s,
                    size: (h / 16) * (0.3 + Math.random() * 0.9),
                    colour: pick(colours), temp: true });
    }
  }

  // --- Fireworks: rockets and bursts for 5 seconds ---
  const fwColours = ["#ff3b3b", "#ffd700", "#3bff6b", "#3bd5ff", "#ff5bf0", "#ffffff", "#ff9a2e"];
  let fwUntil = 0, fwNext = 0, rockets = [], sparks = [];
  function fireworks() { fwUntil = performance.now() + 5000; }

  function burst(x, y, colour) {
    const n = 80 + Math.floor(Math.random() * 50), v = h / 110;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = v * (0.4 + Math.random() * 0.8);
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    life: 1, decay: 0.012 + Math.random() * 0.012,
                    colour: Math.random() < 0.15 ? "#fff" : colour });
    }
  }

  function updateFireworks(t, k) {
    if (t < fwUntil && t >= fwNext) {           // launch a rocket every 150-400 ms
      rockets.push({ x: w * (0.1 + Math.random() * 0.8), y: h,
                     vy: -h / 38 * (0.85 + Math.random() * 0.3),
                     top: h * (0.12 + Math.random() * 0.35), colour: pick(fwColours) });
      fwNext = t + 150 + Math.random() * 250;
    }
    for (const r of rockets) {
      r.y += r.vy * k;
      if (r.y <= r.top) { burst(r.x, r.y, r.colour); r.done = true; }
    }
    rockets = rockets.filter(r => !r.done);
    const g = h / 4000;
    for (const p of sparks) {
      p.vx *= Math.pow(0.97, k); p.vy = p.vy * Math.pow(0.97, k) + g * k;
      p.x += p.vx * k; p.y += p.vy * k; p.life -= p.decay * k;
    }
    sparks = sparks.filter(p => p.life > 0);
  }

  function drawFireworks() {
    if (!rockets.length && !sparks.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const r = Math.max(2, h / 260);
    for (const p of rockets) {
      ctx.fillStyle = "#ffe9b0";
      ctx.fillRect(p.x - r / 2, p.y, r, r * 6);
    }
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.colour;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function doAction(a) {
    if (a === "flurry") flurry();
    else if (a === "fireworks") fireworks();
  }

  // --- Remote: visitors' presses go to every projector on the same channel ---
  const projector = new URLSearchParams(location.search).has("projector");
  if (projector) document.body.classList.add("projector");
  const clientId = Math.random().toString(36).slice(2, 10);
  const cdRemote = window.cdRemote = { status: "off", projector, received: [] };
  let relayUrl = null;

  async function setupRemote() {
    try {
      const cfg = await (await fetch("config.json", { cache: "no-store" })).json();
      if (!cfg.remote_buttons || !cfg.relay || !cfg.channel) return;
      const repo = normRepo(cfg.repo) || siteRepo(location);
      const topic = await topicFor(cfg.channel, repo);
      relayUrl = String(cfg.relay).replace(/\/+$/, "") + "/" + topic;
      Object.assign(cdRemote, { status: "ready", repo, topic });
      if (projector) listen();
    } catch (e) { cdRemote.status = "off"; }   // e.g. opened as a local file: buttons still work locally
  }

  function send(action) {
    if (!relayUrl || projector) return;
    // text/plain body keeps this a "simple" request, so no CORS preflight is needed
    fetch(relayUrl, { method: "POST", body: JSON.stringify({ action, from: clientId }) })
      .then(r => { if (r.ok) toast("Sent to the window ✓"); })
      .catch(() => {});
  }

  const lastSeen = {};
  function listen() {
    const es = new EventSource(relayUrl + "/sse");
    es.onopen = () => { cdRemote.status = "listening"; };
    es.onerror = () => { cdRemote.status = "reconnecting"; };   // EventSource retries by itself
    es.onmessage = e => {
      try {
        const ev = JSON.parse(e.data);
        if (ev.event && ev.event !== "message") return;
        const msg = JSON.parse(ev.message);
        if (msg.from === clientId || !["flurry", "fireworks"].includes(msg.action)) return;
        const now = performance.now();               // at most one of each per 0.7 s
        if (now - (lastSeen[msg.action] || 0) < 700) return;
        lastSeen[msg.action] = now;
        cdRemote.received.push(msg.action);
        doAction(msg.action);
      } catch (err) { /* ignore anything that isn't ours */ }
    };
  }

  let toastTimer;
  function toast(t) {
    const el = document.getElementById("toast");
    el.textContent = t; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  for (const id of ["flurry", "fireworks"]) {
    const btn = document.getElementById(id);
    btn.addEventListener("click", () => {
      doAction(id);
      send(id);
      btn.disabled = true;                            // short cooldown so one person can't flood it
      setTimeout(() => { btn.disabled = false; }, 1500);
    });
  }
  setupRemote();

  // Full screen on click/tap
  document.addEventListener("click", e => {
    if (e.target.closest("#controls")) return;
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch (e) { /* not supported (e.g. iPhone) */ }
  });

  // Hide cursor and hint after 3 s without movement
  let idleTimer;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  }
  ["mousemove", "touchstart", "keydown"].forEach(e => document.addEventListener(e, wake));
  wake();

  // Keep the screen from sleeping where the browser allows it
  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });
  keepAwake();

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
}

if (typeof module !== "undefined") module.exports = { countdownState, normRepo, siteRepo, topicFor };
</script>
</body>
</html>
